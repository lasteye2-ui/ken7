<style>
:root{--navy:#101c2c;--navy2:#1b2b42;--cyan:#2fc3f2;--cyan-d:#0b86b3;--bg:#eef2f6;--paper:#fff;--ink:#17202e;--mute:#5b6778;--line:#d6dde6;--warn:#c2410c;--rec:#e03131;--ok:#177a4b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:15px/1.6 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}

.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.btn{border:0;border-radius:6px;padding:11px 20px;font-weight:700;background:var(--cyan);color:#06222d}
.btn:hover{background:#5ad3f7}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:16px 34px;font-size:19px}
.setcard{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.setcard:hover{border-color:var(--cyan-d);box-shadow:0 2px 0 var(--cyan)}
.setcard b{font-size:17px}
.tag{display:inline-block;font-size:12px;background:var(--navy);color:#fff;border-radius:4px;padding:1px 8px;align-self:flex-start}
.mute{color:var(--mute)}
.small{font-size:13px}
.notice{border-left:4px solid var(--cyan);background:#e6f6fc;padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.notice.warn{border-color:var(--warn);background:#fdeee6}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1f5f9}
.scroll{overflow-x:auto}
/* exam */

.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}

.rec{display:none;align-items:center;gap:6px;font-weight:700;color:#ff8a8a}
.rec i{width:11px;height:11px;border-radius:50%;background:var(--rec);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
.body.iv{grid-template-columns:minmax(0,1fr) 380px}
.work{display:flex;flex-direction:column;min-height:0;min-width:0}

.tab{border:1px solid var(--line);border-bottom:0;background:#f4f7fa;padding:7px 14px;border-radius:6px 6px 0 0;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--paper);color:var(--ink);font-weight:700;border-top:3px solid var(--cyan)}
.panels{flex:1;min-height:0;overflow:auto;background:var(--paper);padding:20px}
.panel[hidden]{display:none}
.side{display:none;background:var(--navy2);color:#fff;padding:16px;overflow:auto;flex-direction:column;gap:12px}
.body.iv .side{display:flex}
.qbox{background:#0c1522;border:1px solid #33475f;border-radius:8px;padding:16px}

.qbox .q{font-size:18px;line-height:1.6;margin:6px 0 0}
.qbar{height:6px;background:#33475f;border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--cyan);width:0}
.qlist{font-size:13px;color:#aebccd;display:grid;gap:4px;padding:0;margin:0;list-style:none}
.qlist li.done{opacity:.55}
.qlist li.cur{color:#fff;font-weight:700}
#pip{width:100%;border-radius:8px;background:#000;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1)}
.memo{width:100%;min-height:140px;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;resize:vertical}
.cta{position:fixed;inset:0;background:rgba(10,18,30,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.cta .box{background:var(--paper);border-radius:10px;padding:30px;max-width:520px;text-align:center}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--warn);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700;z-index:30;display:none}
.card-item{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfdff}
.card-item h4{margin:0 0 6px;font-size:16px}
.rev{background:#f4f7fa;border-radius:6px;padding:6px 10px;margin:4px 0;font-size:14px}
input.sc{width:54px;padding:4px;border:1px solid var(--line);border-radius:4px;text-align:center}
.meter{height:8px;background:#dfe6ee;border-radius:4px;overflow:hidden;max-width:320px}
.meter i{display:block;height:100%;width:0;background:var(--ok)}
video.play{width:100%;max-width:760px;border-radius:8px;background:#000}
@media(max-width:900px){.body.iv{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.clock{font-size:24px}#exam{height:auto;min-height:100vh}.panels{min-height:50vh}}

<div class="cta" id="cta"><div class="box"><h2>준비 시간 종료</h2><p>면접실로 이동했다고 생각하고 준비되면 시작 버튼을 누르세요.<br><b>시작 버튼을 누르는 순간 녹화가 자동으로 시작되고 15분이 흐릅니다.</b></p><button class="btn big" id="btnStart2">면접 시작</button><p><button class="btn ghost small" id="ctaHome" style="margin-top:14px">처음으로</button></p></div></div>

<script>
const SETS=[];
/* ===== 세트 1 : 미래 기술 4종 비교·평가 (2025학년도형) ===== */
SETS.push({
 id:1,title:"세트 1 · 미래 기술 4종 평가와 추천",kind:"자료 비교·평가형 (2025 기출 유형)",
 task:`<p>당신은 <b>미래에너지기술 심사위원회</b>의 위원입니다. 홍보 자료가 제공된 4가지 기술 중 <b>사회에 가장 먼저 보급해야 한다고 생각하는 기술 1개</b>를 선정하려고 합니다.</p>
 <ol><li>[자료 1]~[자료 4]의 홍보 자료를 읽고, [평가표]의 5개 기준(기술력, 안전성, 윤리·사회, 사용자 만족도, 생태·환경)에 따라 기술별로 1~5점을 매기세요. 점수를 준 이유를 메모하세요.</li>
 <li>총점이 가장 높거나 본인이 가장 추천하는 기술 1개를 정하고, 그 이유를 설명할 준비를 하세요.</li>
 <li>선택한 기술이 가져올 수 있는 문제점과 그에 대한 대응 방안도 생각해 보세요.</li></ol>
 <p class="small mute">※ 홍보 자료는 기업이 작성한 것이므로 과장되었을 수 있습니다. 자료에 없는 내용은 합리적으로 추론해도 좋습니다. 정답은 없으며 근거와 논리가 중요합니다.</p>`,
 materials:[
 {tab:"자료 1 · 윈드스킨",html:`<div class="card-item"><h4>윈드스킨 WindSkin — 건물이 스스로 전기를 만듭니다</h4>
 <p>고층 건물 외벽에 붙이는 0.8mm 두께의 유연 필름. 필름 표면의 미세 진동 소자가 바람의 흐름을 전기로 바꿉니다. 소음 없음, 회전 날개 없음.</p>
 <table><tr><th>항목</th><th>내용</th></tr><tr><td>발전 성능</td><td>평균풍속 4m/s에서 ㎡당 하루 0.9kWh (건물 외벽 30% 도포 시 입주 가구 전력의 약 35% 충당)</td></tr><tr><td>수명</td><td>12년 (이후 필름 교체, 폐필름 재활용률 40%)</td></tr><tr><td>가격</td><td>㎡당 18만 원 (태양광 패널의 약 1.8배)</td></tr><tr><td>주의</td><td>풍속 25m/s 이상에서는 자동 차단. 일부 소자에 희토류 사용</td></tr></table>
 <div class="rev">“외벽이 조용히 전기를 만든다니 신기해요. 다만 한여름 무풍 때는 효과를 못 느꼈어요.” — 아파트 관리소장</div>
 <div class="rev">“필름이 가끔 ‘웅’ 하는 저주파를 내요. 아이가 예민한 집에서는 민원이 있었습니다.” — 입주민</div></div>`},
 {tab:"자료 2 · 스텝제너",html:`<div class="card-item"><h4>스텝제너 StepGen — 걷는 만큼 충전됩니다</h4>
 <p>보도블록 아래 압전 소자가 보행 압력을 전기로 바꿉니다. 지하철역·학교 복도·광장에 설치하면 유동 인구가 곧 발전소가 됩니다.</p>
 <table><tr><th>항목</th><th>내용</th></tr><tr><td>발전 성능</td><td>1명이 1걸음에 약 0.0002kWh (하루 유동인구 10만 명 광장 기준 약 500가구 조명 전력)</td></tr><tr><td>수명</td><td>8년, 블록 단위 교체 가능</td></tr><tr><td>가격</td><td>㎡당 95만 원, 설치를 위해 바닥 굴착 필요</td></tr><tr><td>부가기능</td><td>보행량 데이터 수집(익명), 앱으로 ‘내가 만든 전기’ 표시</td></tr></table>
 <div class="rev">“내가 걷는 만큼 불이 켜지니 걷고 싶어져요.” — 대학생</div>
 <div class="rev">“설치 공사로 상가 앞이 3주 동안 막혔어요. 전기 생산량도 생각보다 적습니다.” — 상인</div></div>`},
 {tab:"자료 3 · 카본캐처 트리",html:`<div class="card-item"><h4>카본캐처 트리 — 인공 나무 한 그루가 숲 100그루만큼</h4>
 <p>높이 6m 인공 나무가 공기 중 이산화탄소를 흡착해 압축 저장하거나 연료 원료로 전환합니다.</p>
 <table><tr><th>항목</th><th>내용</th></tr><tr><td>성능</td><td>1대당 연 1,000t CO₂ 포집 (소나무 약 10만 그루 효과를 홍보)</td></tr><tr><td>에너지 사용</td><td>1t 포집에 전기 약 1,500kWh 필요 (화석연료 전력 사용 시 순감축 효과 급감)</td></tr><tr><td>가격</td><td>1대 40억 원, 연 운영비 6억 원</td></tr><tr><td>부산물</td><td>포집 CO₂를 합성연료로 전환, 흡착제 폐기물 연 20t</td></tr></table>
 <div class="rev">“도시 한복판에 설치해도 냄새가 없고 안전합니다.” — 시청 담당자</div>
 <div class="rev">“나무를 심는 것이 더 싸고 확실한 것 아닌가요?” — 환경단체</div></div>`},
 {tab:"자료 4 · 핀 코어",html:`<div class="card-item"><h4>핀 코어 PIN-Core — 20년간 충전이 필요 없는 가정용 소형 핵융합 배터리</h4>
 <p>주먹 크기 장치 하나로 4인 가구 전력을 20년 공급합니다. 연료는 수소 동위원소 소량이며 폭발 위험이 없다고 홍보합니다.</p>

/* ===== 세트 3 : 두 나라 과학·행복·환경 지수 (2023학년도형) ===== */
function lineChart(title,a,b,max){
 const W=300,H=190,L=30,B=34,T=22,R=10,x=i=>L+i*(W-L-R)/10,y=v=>H-B-v*(H-B-T)/max;
 const pts=s=>s.map((v,i)=>x(i)+","+y(v)).join(" ");
 let g="";for(let v=0;v<=max;v+=2)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e9f0"/><text x="${L-5}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#5b6778">${v}</text>`;
 for(let i=0;i<=10;i+=2)g+=`<text x="${x(i)}" y="${H-18}" font-size="10" text-anchor="middle" fill="#5b6778">${i}</text>`;
 return `<div><div style="font-weight:700;margin-bottom:2px">${title}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:6px">${g}
 <polyline points="${pts(a)}" fill="none" stroke="#0b86b3" stroke-width="2.5"/><polyline points="${pts(b)}" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 3"/>
 <text x="${W-R}" y="${y(a[10])-5}" font-size="10" text-anchor="end" fill="#0b86b3">나람 ${a[10]}</text><text x="${W-R}" y="${y(b[10])+13}" font-size="10" text-anchor="end" fill="#c2410c">다람 ${b[10]}</text>
 <text x="${W/2}" y="${H-1}" font-size="9" text-anchor="middle" fill="#5b6778">경과 연수(년)</text></svg></div>`;
}
const act=(k,n,c,s,h,e,d)=>`<tr><td><b>${k}</b></td><td>${n}</td><td>${c}</td><td>${s}</td><td>${h}</td><td>${e}</td><td>${d}</td></tr>`;

<li>윈드스킨: “35% 충당”은 외벽 30% 도포·평균풍속 4m/s 조건부 수치. 무풍기 효과 없음, 저주파 민원, 희토류 사용.</li>
<li>스텝제너: 1걸음 0.0002kWh. 하루 1인 100걸음 가정 시 10만 명이면 약 2,000kWh/일(가구 10kWh/일 기준 약 200가구). 홍보의 ‘500가구’는 조명 한정 등 조건 확인 필요. ㎡당 95만 원 + 굴착 공사.</li>
<li>카본캐처: 1t 포집에 1,500kWh, 연 1,000t이면 연 1.5GWh를 소비. 화석전력이면 순감축이 작아짐. 40억 원 + 운영비 6억 원/년. 나무 심기 대비 비용 효율 논쟁.</li>
<li>핀 코어: 시험 1,200시간은 20년(약 175,200시간)의 약 0.7%. 초기 고장 2건·원인 미공개, 핵물질 규제. 성능은 높으나 검증과 사회 수용성이 약함.</li></ul>
<p><b>평가표 예시(정답 아님)</b></p><table><tr><th>기준</th><th>윈드스킨</th><th>스텝제너</th><th>카본캐처</th><th>핀 코어</th></tr><tr><td>기술력</td><td>3</td><td>2</td><td>3</td><td>5</td></tr><tr><td>안전성</td><td>4</td><td>5</td><td>4</td><td>2</td></tr><tr><td>윤리·사회</td><td>3</td><td>4</td><td>3</td><td>2</td></tr><tr><td>사용자 만족도</td><td>3</td><td>3</td><td>2</td><td>3</td></tr><tr><td>생태·환경</td><td>4</td><td>3</td><td>2</td><td>4</td></tr><tr><th>총점</th><th>17</th><th>17</th><th>14</th><th>16</th></tr></table>
<p class="small mute">동점이면 ‘가장 추천하는 기술’은 어느 기준을 더 중요하게 보느냐로 결정됩니다. 점수표와 최종 선택이 모순되지 않는지 확인하세요.</p>`,
q:[
{el:[2],a:`<p>예: “꿈의 기술처럼 보여서 흥미로웠지만, 후기를 읽다 보니 모두 약점이 숨어 있어 평가표를 채우는 게 쉽지 않았습니다.” 정답이 없는 도입 질문으로, 긴장을 풀어 주고 자료를 실제로 읽었는지 확인합니다.</p>`,p:["자료의 핵심(기술 4종의 공통점·차이)을 한두 문장으로 정리했다","느낌에 그치지 않고 구체적인 수치·후기를 언급했다","차분하고 솔직하게 의사소통한다"],f:["가장 눈에 띈 수치나 후기는 무엇이었나요?","4개 기술의 공통점을 하나 꼽는다면?"]},
{el:[1,0],a:`<p>예(윈드스킨): “기술력은 중간이지만 상용화에 가깝고(수명 12년), 풍속 25m/s 이상에서 자동 차단되어 안전성이 높습니다. 발전 중 배출이 없고 폐필름 재활용률이 40%라 생태·환경 점수가 높습니다. 저주파 민원은 설치 위치 제한으로 줄일 수 있다고 봅니다.”<br>예(핀 코어): “성능과 사회적 파급력은 최상이나 검증 시간이 0.7%뿐이라 안전성은 낮게 보았습니다. 점수가 가장 높지는 않아도 단계적 시험을 전제로 추천합니다.” 어느 쪽이든 선택과 점수표가 일치하고 근거가 자료에 있어야 합니다.</p>`,p:["5개 기준 모두에 점수와 근거를 제시했다","총점과 최종 추천이 논리적으로 일치한다(불일치 시 이유를 설명)","홍보 자료의 과장·조건을 짚었다(예: 0.7% 검증, 조건부 35%)","선택한 기술의 약점을 스스로 밝혔다"],f:["점수가 같은 기술이 있다면 어떻게 최종 결정하나요?","자료에 없는 정보가 있다면 무엇이 더 필요한가요?"]},
{el:[2,1],a:`<p>예(윈드스킨): ① 저주파 민원 → 주거지 인접 건물은 제외하고 업무·산업 시설부터 설치, 소음 인증 기준을 둔다. ② 희토류 → 재활용·대체 소재 연구. ③ 무풍기 발전 공백 → 태양광·ESS와 병행. 문제를 기술·사회·환경으로 구분하고 <b>누가 어떻게</b> 해결하는지까지 말하면 우수합니다.</p>`,p:["기술적·사회적·환경적 문제를 구분해 제시했다","대응 방안이 구체적이다(주체·방법·순서)","대응이 완전하지 않다는 한계도 인정했다"],f:["해결책을 시행하는 데 드는 비용은 누가 부담해야 할까요?","가장 큰 문제 하나만 고른다면?"]},
{el:[1],a:`<p>예: 스텝제너(발전량 적고 ㎡당 95만 원, 공사 불편), 카본캐처(1t당 1,500kWh 소비, 청정 전력 전제 필요, 40억 원), 핀 코어(검증 0.7%, 규제·이웃 불안). 기술별로 <b>자료 근거 1개 이상</b>을 들면 충족입니다.</p>`,p:["세 기술 모두 약점을 짚었다","각 약점에 자료의 수치·후기 근거가 있다","기술 사이를 비교하는 관점이 있다"],f:["그 약점은 개선될 수 있는 것인가요, 본질적인 한계인가요?"]},
{el:[2,1],a:`<p>정답 없음. 예: “안전성 > 윤리·사회 > 생태·환경 > 기술력 > 사용자 만족도. 한번 생긴 피해는 되돌리기 어렵고, 기술은 사람을 위한 것이어야 하기 때문입니다.” 기준 사이의 상충(예: 기술력은 높지만 안전성이 낮은 경우)을 인식하는 답변이 우수합니다.</p>`,p:["순서를 명확히 제시했다","순서의 이유가 논리적이다","기준 간 상충을 인식하고 어느 쪽을 택할지 설명했다"],f:["순서를 바꾸면 최종 추천이 달라지나요?"]},
{el:[0],a:`<p>창의적 활용 아이디어를 보는 문항. 예: “스텝제너를 학교 계단에 설치하고 ‘우리 반이 만든 전기’로 교실 조명을 켜는 캠페인을 하겠습니다.” 자료 밖 맥락을 만들어 쓰는 상상력과 실현 가능성을 함께 봅니다.</p>`,p:["독창적인 사용 장면을 제시했다","기술의 특성(장단점)을 활용했다","한계나 보완 방법을 함께 말했다"],f:["다른 사람은 선택하지 않을 만한 용도는?"]},
{el:[0,2],a:`<p>예: 핀 코어(에너지 접근성 변화, 전력망 의존도 감소) 또는 카본캐처(기후 대응). 영향의 <b>범위·대상·지속성</b>을 설명하고, ‘부작용 제외’라는 가정을 현실과 구분해 말하는지 봅니다.</p>`,p:["영향의 범위와 대상을 구체적으로 설명했다","가정(부작용 제외)을 인식하고 현실과 구분했다","사회·환경 관점의 통찰이 있다"],f:["부작용을 다시 고려하면 순위가 바뀌나요?"]},
{el:[2],a:`<p>진정성과 구체성이 핵심. 예: “에너지 AI로 오늘 본 발전량 예측과 수요 관리를 연구하고 싶습니다.” 에너지 분야(신소재·수소·그리드·기후 등) 연결과 학교 활동 경험이 있으면 우수합니다.</p>`,p:["관심 분야가 에너지와 연결된다","이유가 구체적(경험·문제의식)이다","입학 후 계획이 한 가지 이상 있다"],f:["그 분야에서 해결하고 싶은 문제 하나는?"]}
]};
JUDGE[2]={ref:`<p><b>출제 의도:</b> 지도·표·카드를 종합해 입지-설비-수요를 연결하고, 제약(예산·환경·태풍)에서 우선순위를 정하는 사고를 봅니다.</p>
<p><b>자료 기반 기준 수치</b></p><ul>
<li>연 수요 합계 5.0GWh (가 2.4, 나 1.1, 다 1.5). 가 마을은 여름 성수기 1.6배, 나 마을은 겨울 난방 수요 큼.</li>
<li>태양광(남사면): 연평균 일사 약 3.83 → 1MW당 약 1.24GWh(북사면 약 2.95 → 0.96GWh). 12억/MW.</li>
<li>풍력: 북동 해안 연평균 약 6.1m/s → 2MW 1기 약 4GWh, 겨울(8.2m/s) 강하고 여름(3.9) 약함. 30억/기. 25m/s 이상 정지(태풍).</li>
<li>조류: 남쪽 해협 평균 1.8m/s(≥1.5 조건 충족), 1기 연 1.6GWh, 25억/기. 단, 갯벌 인근은 람사르 습지·철새 규제.</li>
<li>비용 대비 발전량(억 원/GWh): 풍력 약 7.5 < 태양광 약 9.7 < 조류 약 15.6.</li></ul>
<p><b>모범 계획 예시</b>(정답 아님): 풍력 1기(북동 해안, 나 마을 인근) 30억 + 태양광 3MW(남사면, 가 2MW·다 1MW) 36억 + ESS 6MWh 48억 = <b>114억 원</b>(예산 120억 이내). 생산 약 4.0 + 3.7 = 7.7GWh로 수요 5.0GWh 대비 여유 확보. 조류는 갯벌 규제 때문에 제외하거나 추후 확대 후보로 둠. 겨울에는 풍력이, 여름에는 태양광이 서로 보완합니다.</p>`,
q:[
{el:[1,0],a:`<p>마을별 수요(2.4/1.1/1.5GWh)를 먼저 정리하고, 데이터 1~3에서 입지를 정합니다. 풍력은 북동 해안(겨울 8.2m/s), 태양광은 일조가 좋은 남사면, 조류는 남쪽 해협(평균 1.8m/s)이 적합. 예산 합계가 120억 이하이고 총 발전량이 수요를 상회하며 여유율을 설명하면 충족입니다.</p>`,p:["마을별 수요를 정리했다","데이터 근거로 설비와 입지를 연결했다(풍속·일사량·유속 수치 언급)","예산 120억 이내임을 계산해 보였다","생산량과 수요를 비교하고 여유를 설명했다"],f:["그 배치에서 송전 거리(마을 간 연결)는 어떻게 되나요?","왜 그 설비를 그 마을에 두었나요?"]},
{el:[1],a:`<p>겨울(12·1월 일사 2.4·2.6, 북사면 1.5)은 태양광이 약하지만 북동풍이 8.2m/s로 강해 풍력이 보완합니다. 한편 <b>여름 성수기</b>는 수요 1.6배인데 풍속 3.0~3.9, 6~7월 일사 4.1·3.6으로 낮아 가장 취약합니다. 대비책: ESS, 조류 발전, 디젤 비상 발전기 유지, 수요 관리(냉동창고 시간대 조정).</p>`,p:["부족한 계절을 데이터로 특정했다(겨울 또는 여름 성수기)","설비 간 계절적 보완 관계를 설명했다","ESS·수요 관리 등 구체적 대비책을 제시했다"],f:["ESS 용량은 며칠 분을 기준으로 정했나요?"]},
{el:[1,2],a:`<p>풍력은 25m/s 이상에서 정지합니다(태풍 순간 40m/s 이상). 대응: ESS와 태양광으로 단기 공급(다만 태풍 중 일사는 낮음), 조류는 상대적으로 영향이 작음, 디젤 발전기를 비상용으로 남김, 병원·냉동창고 등 우선순위 부하 차단 계획, 사전 예보에 맞춘 ESS 만충전.</p>`,p:["풍력 정지 조건(25m/s)을 정확히 언급했다","여러 층의 대응(저장·보조 설비·수요 관리)을 제시했다","주민 안전·필수 시설 우선순위를 고려했다"],f:["태풍이 5일간 이어지면?"]},
{el:[1],a:`<p>예산 60억이면 비용 대비 발전량이 좋은 풍력 1기(30억) + 태양광 2MW(24억) = 54억 정도를 우선. 기준은 ‘억 원당 GWh’, 환경 규제 위험, 계절 보완성. 조류와 ESS는 후순위이거나 일부 축소.</p>`,p:["우선순위 기준을 명시했다(비용 효율·규제·보완성)","기준에 맞는 구체적 배분을 제시했다","포기한 설비의 위험(공급 불안)을 인정했다"],f:["수요를 줄이는 방법으로 예산을 아끼면?"]},
{el:[2,0],a:`<p>예: 설치 위치를 남쪽 해협의 어업 비수기·철새 비도래기에 맞추고, 환경영향 모니터링과 어업 보상·전기요금 감면 같은 이익 공유를 제안합니다. 끝내 반대가 있으면 조류를 포기하고 태양광+ESS로 대체합니다. 반대 의견을 존중하며 계획을 바꾸는 유연함이 핵심입니다.</p>`,p:["반대 이유(갯벌·철새·어업)를 정확히 이해했다","타협안이나 대안을 구체적으로 제시했다","설득과 보상, 참여 방식을 함께 고려했다"],f:["주민 투표에서 반대가 과반이면?"]},
{el:[0],a:`<p>창의 문항. 예: 잉여 전력으로 수전해 수소를 만들어 선박·연료전지에 사용, 양식장 부유식 태양광, 전기 어선의 배터리를 ESS로 활용(V2G), 파력 발전. 섬의 맥락과 효과·한계를 함께 말하면 우수합니다.</p>`,p:["섬의 맥락에 맞는 독창적 아이디어다","효과를 정량·정성으로 설명했다","한계와 비용을 인정했다"],f:["그 아이디어를 가장 먼저 시험할 장소는?"]},
{el:[2],a:`<p>예: “데이터로 설비를 배치하는 과정이 재미있었습니다. 수소 저장과 전력망 연구를 하고 싶습니다.” 오늘 과제와 연결된 구체적 관심과 계획이 있으면 충족.</p>`,p:["관심 분야가 에너지와 연결된다","오늘 문제와의 연결이 있다","구체적 계획이 있다"],f:[]}
]};

JUDGE[3]={ref:`<p><b>출제 의도:</b> 그래프를 정확히 읽고(과학·행복·환경의 상충), 제한 조건(비용 10, 시점 계수)에서 선택·조합하며 이웃 나라와의 관계까지 확장하는지 봅니다.</p>
<p><b>그래프 해석 기준</b></p><ul><li>10년 차: 나람국 과학 11·행복 9·환경 2 / 다람국 과학 5·행복 9·환경 10. 최종 행복은 같지만 구성이 다름.</li>
<li>나람국은 과학 집중(환경 6→2로 하락), 다람국은 환경 집중(과학 2→5 정체).</li>
<li>환경 격차는 4년 차 이후 4 이상, 7년 차 이후 6 이상. 과학 격차는 3년 차 이후 벌어짐. 행복은 8년 차까지 비슷.</li>
<li>상생 방안 예: 나람국 기술 수출 ↔ 다람국 관광·환경 자원 공유.</li></ul>
<p><b>라람국 모범 계획 예시</b>(정답 아님, 초기 3·3·3, 총비용 10):</p>
<table><tr><th>항목</th><th>시점</th><th>비용</th><th>반영 효과(시점 계수 적용·반올림)</th></tr>
<tr><td>R4 재생에너지 전환</td><td>1~3년(×1.5)</td><td>3</td><td>과학 +2, 행복 0, 환경 +5</td></tr>
<tr><td>R5 공공의료 확충</td><td>1~3년(×1.5)</td><td>3</td><td>과학 +2, 행복 +3, 환경 0</td></tr>
<tr><td>R8 이웃 나라와 공동 연구</td><td>1~3년(×1.5)</td><td>2</td><td>과학 +3, 행복 0, 환경 +2</td></tr>
<tr><td>R3 주 4일 근무제</td><td>4~7년(×1)</td><td>2</td><td>과학 −1, 행복 +3, 환경 0</td></tr>
<tr><th colspan="2">합계</th><th>10</th><th>최종 과학 9 · 행복 9 · 환경 10 (균형형)</th></tr></table>
<p class="small mute">대안: 과학 집중형(R1+R8+R7 등)은 과학은 높으나 환경이 급락해 나람국의 전철을 밟습니다. 어떤 조합이든 <b>비용 ≤10, 계산 정확성, 선택 이유</b>가 채점 기준입니다.</p>`,
q:[
{el:[1,0],a:`<p>“나람국은 과학에 집중해 10년 차 과학 11을 달성했지만 환경이 6에서 2로 하락했습니다. 다람국은 환경을 우선해 10을 얻었으나 과학은 5입니다. 두 나라 모두 행복은 9로 같지만, 다람국 국민이 더 건강한 환경에서 살 가능성이 큽니다. 다람국이 관광, 나람국이 기술 수출을 맡는 상생도 가능합니다.”</p>`,p:["10년 차 수치를 정확히 읽었다","시간에 따른 추이(격차 확대 시점)를 짚었다","지수 간 상호작용을 해석했다(환경↔건강·이주, 과학↔외교력)","상생 또는 대안을 덧붙였다"],f:["두 나라 중 한 곳에서 산다면 어디를 택하겠습니까?","나람국의 환경지수 하락은 어떤 현상을 낳을까요?"]},
{el:[1,0],a:`<p>위 모범 계획 표 참고: R4+R5+R8을 초반, R3을 중반에 실행해 비용 10, 최종 9/9/10. 고득점 답안은 ① 비용 합계 확인 ② 시점 계수 계산 ③ 최종 지수 예측 ④ 균형형 vs 집중형 선택 이유 ⑤ R7처럼 상충 큰 항목의 처리까지 설명합니다. 다른 조합도 계산과 논리가 맞으면 정답으로 인정합니다.</p>`,p:["선택 항목 비용이 10 이내이다","시점 계수(1.5배/1배/0.5배)를 반영해 계산했다","세 지수의 최종 값을 예측했다","선택 이유(균형 또는 집중)가 일관되다","상충 항목(R7)의 위험을 인식했다"],f:["R7을 선택하면 어떻게 되나요? 보완할 방법이 있나요?","예산이 12로 늘어나면 무엇을 추가하나요?"]},
{el:[1],a:`<p>효과가 누적되는 환경·에너지 전환(R4)을 초반에 배치하고, 비용이 낮은 R6은 후반에도 가능하나 효과가 0.5배라는 점을 인식합니다. 초기 투자의 효과(1.5배)와 후반의 즉시성(행복 향상) 사이의 선택을 설명하면 우수.</p>`,p:["시점 계수의 의미를 이해했다","항목 특성에 따라 시점을 달리했다","초기·후기 선택의 상충을 설명했다"],f:["8~10년 차에 꼭 해야 하는 항목이 있다면?"]},
{el:[2,0],a:`<p>갈등: 환경 오염의 국경 이동, 과학 격차에 따른 외교·무역 압력, 인구 이동(은퇴·이민). 협력: 공동연구(R8), 기술-관광 교환, 환경 협약과 오염 모니터링. 반대 시나리오까지 본 답변이 우수합니다.</p>`,p:["갈등 요인을 구체적으로 제시했다","협력 방안이 실현 가능하다","상대 국가의 입장에서도 생각했다"],f:["상대국이 협력을 거부하면?"]},
{el:[0,2],a:`<p>예: 소득 불평등, 교육, 건강 기대수명, 사회적 신뢰, 안전. 측정: 통계·설문·복합지수. 한계: 측정 가능성, 지표 간 상충, 목표 왜곡(지표만 올리는 행동). 새로운 관점과 한계 인정이 핵심.</p>`,p:["새로운 지표를 제안했다","측정 방법을 구체적으로 제시했다","지표의 한계를 인정했다"],f:["그 지표가 과학지수와 충돌한다면?"]},
{el:[2],a:`<p>가장 고민한 점(예: 환경과 과학의 상충)을 솔직하게 말하고, 에너지·환경·시스템 설계 분야와 연결합니다. 진정성과 구체성이 중요.</p>`,p:["고민한 지점이 구체적이다","관심 분야와 연결했다","입학 후 계획이 있다"],f:[]}
]};
JUDGE[4]={ref:`<p><b>출제 의도:</b> 선택·조합 문제에서 에너지 균형을 계산하고 위험·우선순위·조건 변화를 다루는 의사결정 능력과 설득의 인문적 소양을 봅니다.</p>
<p><b>에너지 균형 기준</b></p><ul><li>소비 = 기본 60 + 인원 10 = <b>70</b>. 순생산 = 생산 − 소비(모듈).</li>
<li>① 샤클턴 능선(일조 90%): A 태양광 순 33(40×0.9−3), B 원자로 순 42, C 연료전지 순 25(얼음 인근). D RTG 순 11, E 순 19, F 기대값 불확실.</li>
<li>엔지니어 1명당 에너지 +3.</li></ul>
<p><b>모범 계획 예시</b>(정답 아님): 기지 ① 샤클턴 능선, 모듈 A+B+C = 33+42+25 = <b>100</b> (소비 70 대비 여유 30). 승무원: 엔지니어 3, 의사 1, 심리상담사 2, 교사·연구원 1, 농업·생태 2, 안전·경비 1. 속성 예: 행복 8, 건강 5, 안전 6, 교육 3, 환경 6.</p>
<p><b>조건 변경(태양 폭풍 14일) 검산:</b> A 중단 → B+C 순 67 + 엔지니어 +9 = 76 ≥ 70이므로 유지 가능. 반대로 A+C+D 조합은 36+9=45로 70 미달 → 계획 수정 필요(원자로 추가 또는 저장 증설).</p>`,
q:[
{el:[1,0],a:`<p>위치·모듈·인원을 선택 이유와 함께 설명. 평가 포인트: 에너지 균형(≥70)을 계산했는지, 후보지 특성(일조·얼음·방사선)과 모듈을 연결했는지, 10명 구성이 속성(행복·건강·안전·교육·환경)을 고루 충족하는지.</p>`,p:["생산 ≥ 소비(70)임을 계산으로 보였다","위치와 모듈이 특성 면에서 연결된다","승무원 구성이 에너지 외 속성을 고려한다","모듈 수 제한(3종)과 인원 10명을 지켰다"],f:["왜 그 후보지를 버리고 이곳을 택했나요?","엔지니어를 1명 줄여도 에너지는 충분한데 왜 유지했나요?"]},
{el:[1,2],a:`<p>예상 위험: 태양 폭풍·방사선, 운석, 극저온·월진(먼지), 단일 장비 고장, 원자로 사고, 심리적 고립. 대응: 이중화, 지하·차폐 구조, 예비 부품·3D 프린팅, 비상 모드(부하 우선순위), 심리 지원. 위험을 ‘확률×영향’으로 나누고 대응이 구체적이면 우수.</p>`,p:["위험을 2개 이상 구체적으로 제시했다","각 위험에 맞는 대응책이 있다","위험 간 우선순위를 설명했다"],f:["가장 치명적인 위험 하나는? 그것이 발생하면 첫 24시간 대응은?"]},
{el:[1],a:`<p>예: 원자로의 안전 vs 출력, 위치 선택(일조 vs 얼음). 우선순위: 1순위 에너지·생존, 2순위 안전, 3순위 정서·교육. 결정 기준과 포기한 것을 분명히 말해야 합니다.</p>`,p:["결정이 어려운 지점을 구체적으로 말했다","우선순위 기준이 명확하다","포기한 것의 대가를 인정했다"],f:["우선순위가 바뀌는 조건이 있다면?"]},
{el:[2],a:`<p>1년의 계획 예: 1~3개월 위험·효과 공개 자료 작성, 4~8개월 시뮬레이션 시연·시민 설명회·교육 콘텐츠, 9~12개월 위원회 질의응답과 단계적 실험 제안. 투명성, 비공학적 소통(공감·참여), 국제 협력이 핵심.</p>`,p:["설득 대상(대중·위원회)을 구분했다","구체적 타임라인이 있다","위험을 숨기지 않는 소통 방식이다"],f:["핵 에너지를 반대하는 시민에게 첫마디는?"]},
{el:[0,1],a:`<p>폭풍 14일: 태양광 0, 통신 두절. 모범 계획은 B+C 순 67+엔지니어 9 = 76으로 유지 가능. 대응: 비상 모드로 부하 우선순위, 수소 저장 활용, 지하 대피. 조합이 달라지면(A+C+D 등) 45로 부족하므로 원자로 추가·저장 확대가 필요. 계산으로 설명하고 계획을 유연하게 바꾸는 것이 핵심.</p>`,p:["조건 변화를 계산에 반영했다(태양광 0)","계획을 구체적으로 수정했다","불확실성과 한계를 인정했다"],f:["통신이 복구되기 전 지구와 협의 없이 내려야 할 결정은?"]},
{el:[0],a:`<p>예: 지하 도시 농장, 이동식 소형 핵융합 시험 모듈, 달 먼지 필터 로봇, 우주인 VR 심리 휴식 공간 등. 창의성과 필요성(문제와 연결)을 함께 말하면 우수.</p>`,p:["독창적이다","기지의 문제와 연결된다","효과·한계를 설명했다"],f:["다른 아이템과 함께 쓸 때 시너지는?"]},
{el:[2],a:`<p>진정성과 구체성. 예: “에너지 시스템 설계와 우주 응용에 관심이 있어 에너지 AI·그리드를 공부하고 싶습니다.”</p>`,p:["에너지 분야와 연결된다","오늘 문제와 연결한다","구체적 계획이 있다"],f:[]}
]};

/* 상세 모범답안·채점기준. r = 5개 기준(자료·근거 활용 / 논리·구조 / 창의·실현 가능성 / 관점·윤리 고려 / 소통·성찰) × "5점|3점|1점" */
const DETAIL={};

DETAIL[1]={ref:JUDGE[1].ref,q:[
{m:`처음에는 네 기술이 모두 꿈같아서 흥미로웠습니다. 그런데 후기와 표를 읽다 보니 장점 옆에 항상 조건이 붙어 있었습니다. 윈드스킨의 35% 충당은 외벽 30%를 덮고 평균풍속이 4m/s일 때의 수치였고, 핀 코어는 20년 수명을 말하지만 시험은 1,200시간뿐이었습니다. 그래서 점수를 줄 때 광고 문구보다 조건과 검증 정도를 먼저 보려고 했습니다.`,
r:R("수치 2개 이상을 정확히 인용|자료를 언급하나 수치가 부정확|자료와 무관한 인상만 말함","관찰에서 평가 방식으로 이어짐|관찰과 느낌이 나열됨|두서가 없음","홍보 자료를 의심하는 새로운 관점|무난한 소감|소감이 없음","과장·조건·검증 부족을 짚음|장단점 일부만 인식|광고를 그대로 수용","차분하고 간결하게 30~60초 내 답변|보통, 일부 머뭇거림|질문을 이해하지 못하거나 침묵"),
x:["자료를 읽지 않고 일반적 감상만 말함","1분을 넘겨 이후 질문 시간을 잠식함"]},
{m:`저는 윈드스킨을 추천합니다. 5개 기준 점수는 기술력 3, 안전성 4, 윤리·사회 3, 사용자 만족도 3, 생태·환경 4로 17점입니다. 스텝제너도 17점이지만 1걸음 0.0002kWh라 하루 10만 명이 지나도 수백 가구 수준이고 ㎡당 95만 원이라 확장성이 낮다고 보았습니다. 카본캐처는 1t 포집에 1,500kWh가 들어 전력이 화석연료이면 효과가 줄어 14점, 핀 코어는 기술력 5점이지만 시험 1,200시간이 목표 수명의 0.7%라 안전성을 2점으로 보아 16점입니다. 동점인 스텝제너와 비교하면 윈드스킨은 이미 지어진 건물 외벽에 붙여 새 부지 없이 발전하고 25m/s 이상에서 자동 차단되는 안전장치가 있습니다. 약점인 무풍기 공백, 저주파 민원, 희토류는 업무용 건물부터 설치하고 태양광과 병행하며 필름 재활용을 의무화해 줄이겠습니다.`,
r:R("5개 기준 모두 수치·후기로 근거 제시|일부 기준만 근거 있음|근거 없이 선택만 말함","점수표·총점·최종 선택이 일치하고 동점을 설명함|대체로 일치하나 동점 처리 불명확|점수와 선택이 모순됨","약점 보완안이 구체적이고 독창적|일반적 보완안|보완안 없음","안전·사회 수용성·환경을 균형 있게 반영|한두 기준만 중시|기술력만 고려","결론, 근거, 보완 순서로 명료함|내용은 맞으나 구조가 흐트러짐|결론이 불분명"),
x:["점수 합계 계산 오류를 인지하지 못함","홍보 문구를 그대로 인용하며 비판 없음","선택한 기술의 약점을 전혀 말하지 않음"]},
{m:`윈드스킨의 문제를 기술, 사회, 환경 세 가지로 나누겠습니다. 첫째 기술적으로 무풍기에는 발전이 거의 없어 후기처럼 한여름에 효과를 못 느낄 수 있습니다. 태양광과 에너지저장장치를 함께 두어 공백을 메우겠습니다. 둘째 사회적으로 저주파 민원이 있었으므로 소음 기준을 먼저 정하고, 병원·학교·주거 밀집 지역은 제외하고 업무용 건물부터 시범 적용해 민원 데이터를 공개하겠습니다. 셋째 환경적으로 희토류와 폐필름 문제가 있어 재활용률 40%를 높이는 목표를 계약 조건에 넣고 12년 뒤 교체 때 회수를 의무화하겠습니다. 이 방법으로도 완전히 해결되지는 않으므로 시범 설치 결과를 보고 확대 여부를 판단하겠습니다.`,
r:R("후기(저주파·무풍기)와 사양(25m/s, 40%)을 인용|일부만 인용|자료와 무관한 일반론","문제를 세 영역으로 나누고 대응을 일대일로 제시|구분은 하나 대응이 막연함|문제와 대응이 맞지 않음","시범 적용·기준 사전 설정 등 구체적 절차 제안|일반적인 대응|대응이 없음","주민·환경 영향과 해결의 한계를 인정|한 관점만 고려|피해를 무시","순서와 책임 주체가 분명함|이해 가능하나 산만함|혼란스러움"),
x:["문제점을 말하지 않고 장점만 반복함","대응 방안이 ‘노력하겠다’ 수준에 그침"]},
{m:`스텝제너는 1걸음 0.0002kWh로 하루 10만 명이 지나도 수백 가구 조명 수준이고, ㎡당 95만 원에 굴착 공사로 상가 앞이 3주 막혔다는 후기가 있어 비용 대비 효과가 낮습니다. 카본캐처는 연 1,000t을 잡으려면 약 1.5GWh를 쓰므로 화석전력이면 오히려 배출이 늘 수 있고, 40억 원에 운영비 6억 원이 들어 나무 심기보다 비싸다는 지적이 있습니다. 핀 코어는 성능이 좋지만 시험 시간이 목표의 0.7%이고 초기 고장 2건의 원인이 공개되지 않았으며, 핵물질 규제와 이웃의 불안이라는 사회적 장벽이 있습니다. 앞의 둘은 비용과 효율 문제라 개선 여지가 있지만, 핀 코어의 안전·규제 문제는 검증이 쌓여야 풀립니다.`,
r:R("세 기술 모두 수치·후기로 단점을 입증|두 기술만 근거 있음|근거 없는 비난","개선 가능한 한계와 본질적 한계를 구분|단점만 나열|논리 없음","제시된 숫자를 직접 계산해 보임(예: 연 1.5GWh)|자료 문장을 그대로 옮김|자료 활용 없음","기술별 공정하게 평가함|특정 기술에 치우침|편견이 드러남","기술별로 순서 있게 요약|이해 가능|산만함"),
x:["선택하지 않은 기술을 근거 없이 폄하함","자료의 수치를 잘못 인용함"]},
{m:`저는 안전성, 윤리·사회, 생태·환경, 기술력, 사용자 만족도 순으로 중요하다고 봅니다. 안전성은 사고가 나면 되돌릴 수 없고 다른 기준의 장점을 모두 무효로 만들기 때문에 1순위입니다. 윤리·사회는 기술이 사람을 위한 것이어야 하고, 아무리 좋아도 이웃이 반대하면 설치할 수 없다는 점을 핀 코어 후기에서 보았습니다. 생태·환경은 이 기술들이 필요한 이유와 직결됩니다. 기술력은 안전과 수용성이 확보된 뒤에 의미가 있고, 사용자 만족도는 나머지가 충족되면 개선할 수 있는 요소라 후순위로 두었습니다. 이 가중치를 적용하면 핀 코어는 순위가 내려가고 윈드스킨의 선택은 유지됩니다.`,
r:R("순위 변화가 최종 선택에 미치는 영향을 자료로 확인|영향을 언급하나 확인 없음|영향 언급 없음","순서와 이유가 일관됨|이유가 일부 비약|순서만 말함","가치 판단 기준을 자신의 말로 설명|상식적 이유|이유 없음","기준 간 상충(기술력↔안전)을 인식하고 선택|상충을 일부 인식|단일 기준만 중시","결론 먼저, 이유를 2~3개로 정리|이해 가능|장황함"),

{m:`스텝제너를 학교 계단과 복도에 설치해 학급별로 ‘우리 반이 만든 전기’를 표시하는 캠페인을 하고 싶습니다. 발전량은 작지만 걸을수록 전기가 생긴다는 경험이 에너지 절약 습관으로 이어지고, 익명 보행량 데이터는 복도 혼잡 개선에도 쓸 수 있습니다. 목적은 전력 생산이 아니라 교육 효과이므로 비용은 소규모로 제한하고, 개인정보가 수집되지 않도록 데이터는 익명 집계만 사용하겠습니다.`,
r:R("기술의 특성(발전량·데이터 기능)을 활용|특성을 일부 반영|특성과 무관","상황, 활용, 기대 효과의 흐름이 명확|흐름이 약함|논리 없음","독창적이고 구체적인 장면 제시|흔한 아이디어|아이디어 없음","비용·개인정보 등 한계를 인지|일부 인지|한계 무시","생생하고 간결하게 표현|이해 가능|불명확"),

{m:`부작용을 제외하면 핀 코어의 파급력이 가장 크다고 봅니다. 20년간 충전이 필요 없다면 전력망이 약한 지역, 재난 지역, 섬 같은 곳의 전기 접근성이 크게 높아져 에너지 불평등을 줄일 수 있습니다. 다만 부작용을 다시 고려하면 안전 검증과 규제 문제 때문에 순위가 내려가므로 파급력과 실현 가능성은 따로 평가해야 합니다. 카본캐처는 기후 대응의 규모는 크지만 전력 소비가 커 단독으로는 한계가 있습니다.`,
r:R("영향 범위·대상·지속성을 수치나 사례로 설명|일부만 설명|막연함","가정(부작용 제외)을 인식하고 논리를 전개|가정을 약하게 인식|가정을 무시","사회적 변화를 새롭게 상상|일반적 영향|영향 설명 없음","형평성·환경·안전 영향을 함께 고려|한 가지만 고려|고려 없음","질문의 조건을 명확히 짚고 답함|이해 가능|질문과 어긋남"),

{m:`저는 에너지 AI 분야를 공부하고 싶습니다. 오늘 윈드스킨은 풍속에 따라 발전량이 크게 달라졌고, 이런 불안정성을 날씨와 수요 예측으로 줄이면 태양광·저장장치·풍력을 함께 운영할 수 있다고 생각했습니다. 입학하면 발전량 예측 모델을 만들어 보고, 에너지 AI 연구실에서 실제 데이터를 다뤄 보고 싶습니다. 졸업 후에는 도서 지역 같은 전력 취약 지역의 운영 시스템을 개선하는 일을 하고 싶습니다.`,

DETAIL[2]={ref:JUDGE[2].ref,q:[
{m:`세 마을의 연 수요는 물결마을 2.4, 바람마을 1.1, 갯벌마을 1.5GWh로 합계 5.0GWh입니다. 풍력은 겨울 8.2m/s로 가장 강한 북동 해안에 1기(2MW, 30억 원)를 두어 연 약 4GWh를 얻고 바람마을 난방 수요를 맡기겠습니다. 태양광은 일사량이 연평균 약 3.8인 남사면에 3MW(36억 원)를 설치해 물결마을 2MW, 갯벌마을 1MW를 맡기고 연 약 3.7GWh를 얻겠습니다. 조류는 남쪽 해협 평균 유속 1.8m/s로 가능하지만 갯벌마을 인근이 람사르 습지라 환경영향평가 부담이 커서 이번 계획에서는 제외합니다. 저장장치는 6MWh(48억 원)를 두어 합계 114억 원, 생산은 약 7.7GWh로 수요의 1.5배입니다. 여유는 태풍 정지, 일사 저하, 설비 효율 저하에 대비한 것입니다.`,
r:R("수요 5.0GWh와 데이터 수치로 근거 제시|일부 수치만 사용|수치 없이 설명","수요→설비→입지→예산 순으로 일관됨|일부 단계 누락|논리 비약","여유율·계절 보완 등 자신의 설계 의도|무난한 배치|배치 이유 없음","환경 규제·주민 수용성을 고려|일부 고려|고려 없음","표를 보듯 명료하게 요약|이해 가능|혼란스러움"),
x:["예산 120억 초과","설비 조건(풍속 6m/s, 유속 1.5m/s)을 무시하고 배치","수요와 생산을 비교하지 않음"]},
{m:`데이터를 보면 가장 전력이 부족한 때는 두 번입니다. 겨울에는 남사면 일사량이 12월 2.4, 1월 2.6으로 낮고 북사면은 1.5까지 떨어지지만, 북동풍이 8.2m/s로 강해 풍력이 보완합니다. 난방 수요가 큰 바람마을은 풍력 바로 옆이라 유리합니다. 더 취약한 것은 여름 성수기입니다. 물결마을 수요가 1.6배가 되는데 풍속은 3.0~3.9m/s로 낮고 6~7월 일사량은 4.1, 3.6으로 떨어집니다. 이 시기에는 저장장치와 조류 발전, 비상 디젤 발전기를 남겨 두고, 냉동창고 가동 시간을 발전량이 높은 낮으로 옮기는 수요 관리를 병행하겠습니다.`,
r:R("겨울·여름 두 취약 시기를 월별 수치로 특정|한 시기만 수치로 특정|수치 없는 추측","설비 간 계절 보완 관계를 설명|보완을 언급만 함|보완 개념 없음","수요 관리 등 공급 외 대책 제시|저장장치만 언급|대책 없음","성수기 관광 수요 등 지역 특성을 반영|부분 반영|반영 없음","핵심을 두 문장으로 요약 가능|이해 가능|산만함"),
x:["겨울만 보고 여름 성수기를 놓침","풍속·일사량 표를 읽지 않고 일반론만 말함"]},
{m:`풍력은 25m/s 이상에서 정지하고 태풍 때 순간풍속이 40m/s를 넘으므로 며칠간 멈출 수 있습니다. 태풍 예보가 나오면 저장장치를 만충전하고, 병원·냉동창고·펌프장에 먼저 전력을 보내도록 부하 차단 순서를 정해 두겠습니다. 태풍 중에는 일사가 낮아 태양광도 약하므로, 해류 발전은 영향을 덜 받는 보완 수단이 될 수 있고 비상 디젤 발전기는 마지막 안전판으로 남깁니다. 5일 이상 이어지면 저장분이 바닥나므로 공공시설 냉방을 줄이는 수요 관리와 임시 발전기 지원 요청까지 단계별로 준비하겠습니다.`,
r:R("정지 조건(25m/s)과 태풍 풍속(40m/s)을 인용|일부 인용|수치 없음","여러 층의 대응을 단계로 제시|대응이 한두 개|대응 불명확","저장·수요 관리·보조 설비를 조합|단일 대응|대응 없음","필수 시설과 주민 안전을 우선|부분 고려|고려 없음","상황→대응 순서로 명료|이해 가능|혼란"),
x:["풍력 정지 시 전력이 부족하다는 사실을 인식하지 못함"]},
{m:`예산이 60억 원이면 기준을 억 원당 발전량으로 삼겠습니다. 풍력은 약 7.5억 원/GWh, 태양광은 약 9.7억 원/GWh, 조류는 약 15.6억 원/GWh라 풍력과 태양광을 먼저 선택합니다. 풍력 1기 30억 원, 태양광 2MW 24억 원으로 54억 원, 생산은 약 4.0과 2.5GWh로 합계 6.5GWh입니다. 남은 6억 원은 저장 소규모 확장에 쓰고 조류와 대규모 저장은 후순위로 미룹니다. 그렇게 하면 공급이 줄어 태풍과 여름 성수기에 취약해지므로, 수요 관리와 디젤 비상 발전기를 유지해 위험을 줄이겠습니다.`,
r:R("억 원당 발전량 등 수치 비교를 직접 계산|비교하나 계산이 부정확|비교 없음","기준→선택→포기한 것의 순서가 명확|기준이 모호|일관성 없음","수요 관리 등 비용 외 대안|예산 배분만 나열|대안 없음","포기로 생기는 위험을 인정|일부 인정|언급 없음","우선순위를 쉽게 요약|이해 가능|산만함"),
x:["60억 초과 배분","기준 없이 설비를 임의로 선택"]},
{m:`갯벌마을 주민과 환경단체의 반대 이유는 철새 도래지와 갯벌 훼손이라고 이해합니다. 설치 위치를 갯벌에서 먼 남쪽 해협 중앙으로 옮기고, 철새가 오지 않는 시기에 공사하며, 설치 전후로 환경 모니터링을 공개하겠습니다. 어업권 침해에 대비해 어민 대표를 협의체에 넣고, 전기요금 감면이나 수익 일부를 마을 기금으로 돌려주는 이익 공유도 제안하겠습니다. 그래도 반대가 크면 조류 발전은 포기하고 태양광과 저장장치로 대체하며, 이때 부족해지는 발전량은 남사면 태양광을 1MW 늘려 보완하겠습니다.`,
r:R("반대 이유(갯벌·철새·어업)를 자료로 정확히 이해|일부 이해|이해 부족","이해→조정→대안의 순서|단계 일부 누락|일관성 없음","위치·시기 조정과 이익 공유 등 구체안|일반적 설득|설득 방안 없음","환경과 주민 이익을 균형 있게 고려|한쪽만 고려|무시","경청과 협의 자세가 드러남|형식적|일방적"),
x:["반대 의견을 무시하고 강행","대안 없이 계획만 포기"]},
{m:`저는 잉여 전력을 수소로 저장하는 방법을 제안합니다. 낮에 태양광과 풍력이 수요보다 많이 만든 전력을 수전해로 수소로 바꿔 저장하면, 계절이나 태풍으로 공급이 부족할 때 연료전지로 다시 전기를 만들 수 있습니다. 또 섬의 어선이 전기 선박으로 바뀌면 배터리가 이동식 저장장치가 되어 정박 중 전력망을 지원할 수 있습니다. 한계는 수소 저장의 효율 손실과 안전 관리, 초기 비용이므로 소규모 실증으로 시작하고 효과를 확인한 뒤 확대하겠습니다.`,
r:R("섬 데이터(잉여·부족 시기)를 근거로 제안|일부 근거|근거 없음","문제→아이디어→효과→한계의 흐름|일부 누락|논리 없음","독창적이면서 실현 가능|흔한 아이디어|아이디어 없음","비용·안전·환경 영향을 함께 고려|일부 고려|고려 없음","쉽고 명확하게 설명|이해 가능|불명확"),
x:["카드에 이미 있는 설비를 그대로 제안함"]},
{m:`데이터로 설비를 배치하면서 풍속, 일사량, 유속이 계절과 위치에 따라 달라서 에너지 시스템은 지역 특성에 맞춰 설계해야 한다고 느꼈습니다. KENTECH에서 수소에너지와 차세대 그리드를 공부해 오늘처럼 저장과 운영 문제를 해결하고 싶습니다. 특히 도서 지역의 분산 전력망 운영을 연구해 보고 싶습니다.`,

]};

DETAIL[3]={ref:JUDGE[3].ref,q:[
{m:`그래프를 보면 나람국은 과학에, 다람국은 환경에 집중했습니다. 10년 차에 나람국은 과학 11, 행복 9, 환경 2이고 다람국은 과학 5, 행복 9, 환경 10입니다. 행복은 두 나라가 같지만 나람국은 환경이 6에서 2로 떨어졌고, 다람국은 과학이 2에서 5로 느리게 올랐습니다. 환경 격차는 4년 차부터 4 이상, 7년 차부터 6 이상이어서 나람국은 건강과 관광, 인구 유출 문제를 겪을 수 있습니다. 반대로 과학 격차는 3년 차부터 벌어져 다람국은 외교와 무역에서 약해질 수 있습니다. 나람국이 기술을 수출하고 다람국이 관광과 환경 자원을 공유하면 서로의 약점을 보완할 수 있습니다.`,
r:R("10년 차 수치와 격차 발생 연도를 정확히 인용|수치 일부 인용|수치 오류 또는 없음","지수 간 연결(환경↔건강, 과학↔외교)을 설명|지수별 나열|단순 묘사","상생 방안을 새롭게 제안|일반적 제안|제안 없음","두 나라 입장을 모두 고려|한 나라 중심|단정적 평가","표를 읽듯 명료하게 설명|이해 가능|혼란"),
x:["그래프 축·단위를 잘못 읽음","두 나라 중 하나를 일방적으로 우월하다고 평가"]},
{m:`라람국은 환경 4·행복 3·과학 3인 균형형으로 가겠습니다. 비용 10 안에서 R4 재생에너지(3), R5 공공의료(3), R8 공동연구(2)를 1~3년 차에 실행하고, R3 주 4일제(2)를 4~7년 차에 실행합니다. 계산하면 R4는 과학 +2, 환경 +5, R5는 과학 +2, 행복 +3, R8은 과학 +3, 환경 +2, R3은 과학 -1, 행복 +3입니다. 처음 3·3·3에서 과학 9, 행복 9, 환경 10이 됩니다. R7 제조업 단지는 환경 -3이라 나람국의 전철을 밟을 위험이 있어 제외했습니다. 비용은 3+3+2+2=10으로 예산을 정확히 사용했습니다.`,
r:R("비용 합계와 시점 계수 계산이 정확|계산 일부 오류|계산 없음","선택→시점→결과 예측이 일관됨|일부 불일치|근거 없음","균형·집중 중 선택한 전략을 설명|전략이 불분명|전략 없음","환경 악화 등 부작용을 인지하고 회피|일부 인지|무시","표 없이도 따라갈 수 있게 설명|이해 가능|혼란"),
x:["비용 10 초과","같은 항목을 중복 선택","시점 계수를 적용하지 않음"]},
{m:`효과가 오래 쌓이는 R4 재생에너지와 R5 공공의료는 1~3년 차에 실행해 1.5배를 받도록 했습니다. 환경지수는 한번 낮아지면 회복이 느리기 때문에 초기 투자가 유리합니다. 반면 R3 주 4일제는 행복을 즉시 올리지만 생산성이 단기적으로 떨어지므로 경제 기반이 쌓인 4~7년 차에 배치했습니다. 8~10년 차에는 효과가 0.5배라 비용 1인 R6 도시 숲 같은 작은 항목이 적합하며, 이번에는 비용이 남지 않아 제외했습니다. 시점은 효과의 누적성, 위험, 비용을 함께 보고 정했습니다.`,
r:R("1.5·1·0.5배 계수를 사용해 비교|계수를 언급만 함|계수 없음","항목 특성에 따라 시점을 달리함|일관성 약함|근거 없음","초기 투자 vs 후반 즉시 효과의 상충을 설명|상충을 일부 인식|상충 인식 없음","단기 이익과 장기 지속성을 함께 고려|한쪽만 고려|무시","핵심 이유를 2개로 정리|이해 가능|산만"),
x:["시점 효과를 무시하고 항목만 말함"]},
{m:`갈등과 협력 모두 가능합니다. 갈등 요인은 환경 오염이 국경을 넘는 경우, 과학 격차 때문에 한 나라가 외교·무역에서 압력을 받는 경우, 환경이 나쁜 나라 주민이 이웃으로 이주하는 경우입니다. 협력은 R8 공동연구처럼 서로 이익이 되는 활동이 현실적입니다. 나람국과 기술 교류를 하고 다람국과는 환경 협약을 맺어 오염 감시 자료를 공유하겠습니다. 상대국이 협력을 거부하면 국제기구 참여나 제3국과의 공동 연구로 우회하고, 우리나라 지수 목표는 독자적으로 유지하겠습니다.`,
r:R("그래프의 격차 시점을 근거로 갈등 예측|일부 근거|근거 없음","원인→결과→대응이 연결됨|연결 약함|나열","협력 모델을 구체적으로 제안|일반적 협력론|제안 없음","상대국 입장을 이해하고 반영|부분 이해|자국 중심","협상적·설득적 태도|보통|일방적"),
x:["갈등 가능성을 전혀 인정하지 않음"]},
{m:`저는 건강 기대수명, 교육, 소득 불평등, 사회적 신뢰를 추가 지표로 제안하겠습니다. 행복지수가 같아도 불평등이 크면 일부만 행복할 수 있기 때문입니다. 측정은 통계청 자료와 설문을 결합한 복합 지수로 하고, 가중치는 시민 참여로 정하겠습니다. 한계는 지표를 높이려는 행동이 목적이 될 수 있다는 점과 신뢰 같은 요소는 측정이 어렵다는 점입니다. 그래서 지표는 정기적으로 검토하고 현장 사례와 함께 해석하겠습니다.`,
r:R("기존 지수의 한계를 근거로 지표 제안|막연한 제안|제안 근거 없음","문제→지표→측정→한계의 흐름|일부 누락|논리 없음","새롭고 실현 가능한 지표|흔한 지표|지표 없음","형평성·지속가능성을 포함|부분 포함|포함 없음","명료하게 설명|이해 가능|혼란"),
x:["지표를 나열만 하고 측정 방법이 없음"]},
{m:`가장 고민한 부분은 환경을 올리면서 과학도 올리는 방법이었습니다. 환경 지수는 높아도 과학이 낮으면 외교력이 약해질 것 같았고, 과학만 올리면 나람국처럼 환경이 무너졌습니다. 그래서 R8 공동연구처럼 과학과 환경을 함께 올리는 항목을 찾았습니다. KENTECH에서 환경기후·기술이나 에너지 시스템 분야를 공부해 이런 상충을 줄이는 기술을 연구하고 싶습니다.`,
r:R("문제의 구체적 요소를 근거로 고민 설명|일반적 고민|고민 설명 없음","고민→해결→배운 점의 흐름|흐름 약함|논리 없음","상충을 해소하는 구체적 아이디어|일반적 해결|해결 없음","사회·환경의 균형 의식|일부 의식|의식 없음","솔직하고 진정성 있음|보통|준비 부족"),
x:["문제와 무관한 일반적 포부"]}
]};
DETAIL[4]={ref:JUDGE[4].ref,q:[
{m:`저는 ① 샤클턴 능선에 기지를 짓겠습니다. 일조가 약 90%라 태양광 효율이 높고 인근 영구음영 분지에 얼음이 있어 물·산소·연료를 얻을 수 있습니다. 에너지 소비는 기본 60에 인원 10을 더해 70이고, 모듈은 A 태양광 순 33(40×0.9−3), B 원자로 순 42(50−8), C 연료전지 순 25(30−5)로 합계 100입니다. 소비 70 대비 30의 여유가 있습니다. 승무원은 엔지니어 3, 의사 1, 심리상담사 2, 교사·연구원 1, 농업·생태 2, 안전·경비 1명으로 구성해 에너지, 건강, 행복, 교육, 환경, 안전을 고루 채웠습니다. 엔지니어 3명은 에너지 +9도 더해 줍니다.`,
r:R("일조율·소비·순생산을 정확히 계산|계산 일부 오류|계산 없음","위치→모듈→인원의 선택 이유가 일관됨|일부 불일치|근거 없음","특성(얼음·일조)을 활용한 설계|무난한 구성|설계 의도 없음","방사선·안전·정서 요소를 포함|일부 포함|에너지만 고려","표를 보듯 명료|이해 가능|혼란"),
x:["생산이 소비에 미달","모듈 3종 초과 또는 인원 10명 불일치","후보지 위험(착륙 지형)을 언급하지 않음"]},
{m:`가장 큰 위험은 태양 폭풍과 방사선, 운석, 극저온·월진(먼지)으로 인한 장비 고장, 원자로 사고, 장기 고립에 따른 심리 문제입니다. 방사선은 주거 모듈을 지하나 얼음층으로 덮어 차폐하고, 폭풍 예보 시 대피 구역으로 이동하는 절차를 두겠습니다. 장비 고장은 단일 실패점이 없도록 에너지원을 이중화하고 예비 부품과 3D 프린터를 준비하겠습니다. 원자로는 격납과 자동 정지, 원격 감시를 두고 정기 점검하겠습니다. 심리 문제는 심리상담사 2명과 지구와의 정기 통화로 대비하겠습니다. 위험은 발생 가능성과 영향이 큰 순서로 우선순위를 정했습니다.`,
r:R("후보지·모듈 조건을 근거로 위험 도출|일반적 위험|위험 설명 부족","위험→원인→대응을 일대일 제시|대응 일부 부족|논리 없음","이중화·절차 등 구체적 대응|일반 대응|대응 없음","인명 안전과 정서 위험을 모두 고려|한쪽만 고려|고려 없음","우선순위를 근거로 정리|나열|혼란"),
x:["위험을 하나만 말하고 대응이 없음"]},
{m:`가장 어려웠던 결정은 원자로를 넣을지였습니다. 원자로는 순 42로 가장 큰 출력이지만 사고 시 위험이 크고 방사선 차폐가 필요합니다. 연료전지와 태양광만으로 하면 33+25=58이라 소비 70에 미달해 엔지니어를 늘려도 어렵습니다. 그래서 1순위를 생존에 필요한 에너지와 안전 확보에 두고 원자로를 선택하되 차폐와 이중 안전장치를 조건으로 했습니다. 포기한 것은 승무원 중 교육 인원을 1명으로 줄인 것입니다. 새 정보로 원자로의 안전성이 떨어진다고 밝혀지면 RTG와 연료전지를 늘리는 쪽으로 바꾸겠습니다.`,
r:R("수치(58 vs 70)로 결정 근거 제시|근거가 부분적|근거 없음","어려움→기준→선택→포기→변경 조건|일부 누락|논리 약함","대안과 조건부 선택을 제시|대안이 단순|대안 없음","안전·형평·정서의 우선순위를 명시|일부 명시|우선순위 없음","솔직하고 명료함|이해 가능|불명확"),
x:["어려움이 없었다고 답함","우선순위를 말하지 않음"]},
{m:`설득 대상은 일반 대중과 탐험위원회로 나누겠습니다. 1~3개월에는 위험과 한계를 포함한 계획서를 공개하고, 4~8개월에는 시뮬레이션 시연, 시민 설명회, 청소년 교육 콘텐츠로 이해를 넓히겠습니다. 9~12개월에는 위원회 질의응답과 단계적 실험 제안으로 마무리하겠습니다. 원자로를 반대하는 시민에게는 안전 설계, 사고 시 대응, 독립 검증 결과를 먼저 보여주고 우려를 계획 수정에 반영하겠습니다. 투명하게 불확실성을 공개하는 것이 신뢰의 핵심이라고 생각합니다.`,
r:R("설득 자료·시연·검증 결과를 구체적으로 제시|일부 제시|근거 없음","1년 타임라인과 단계가 명확|단계가 막연|계획 없음","참여형 설득(설명회·교육) 제안|일반적 홍보|제안 없음","반대 의견을 계획에 반영|부분 반영|무시","경청·공감적 소통 자세|보통|일방적 설득"),
x:["반대 의견을 홍보로만 대응"]},
{m:`태양 폭풍으로 14일간 태양광과 통신이 끊기면 A는 0이 됩니다. 제 계획은 B와 C가 순 67이고 엔지니어 3명의 +9를 더해 76이라 소비 70을 충족해 유지할 수 있습니다. 다만 비상 모드로 불필요한 부하를 줄이고, 수소 저장분을 우선 사용하며, 승무원은 차폐 구역으로 이동하겠습니다. 만약 A+C+D 조합이었다면 순생산이 33+25+11=69이고 태양광이 빠지면 36에 엔지니어 9를 더해도 45로 부족하므로 원자로를 추가하거나 저장을 늘려야 합니다. 통신이 끊긴 동안은 사전에 정한 비상 규칙으로 현장 책임자가 결정하겠습니다.`,
r:R("조건 변화(A=0)를 계산에 정확히 반영|일부 계산|계산 없음","변화→영향→수정의 흐름|일부 누락|논리 약함","비상 모드·저장 등 유연한 수정안|단순 수정|수정 없음","승무원 안전과 의사결정 책임을 고려|부분 고려|고려 없음","침착하고 명료한 설명|이해 가능|당황·혼란"),
x:["조건 변화에도 원래 계획을 그대로 유지함"]},
{m:`저는 지하 수경재배 농장을 추가 아이템으로 제안합니다. 달 기지의 식량과 산소는 지구에서의 보급에 의존하기 쉬운데, 얼음에서 얻은 물과 LED 조명으로 채소를 기르면 식량과 산소를 부분적으로 자급하고 승무원의 심리 안정에도 도움이 됩니다. 에너지 소비가 늘어나는 단점은 효율 높은 LED와 폐열 재활용으로 줄이겠습니다. 이를 위해 농업·생태 전문가가 이미 2명 있으므로 인력 구성과도 맞습니다.`,
r:R("기지 조건(얼음·에너지)과 연결|일부 연결|연결 없음","문제→아이템→효과→한계|일부 누락|논리 없음","독창적이고 실현 가능성이 있음|흔한 아이디어|아이디어 없음","정서·환경 효과를 함께 고려|부분 고려|고려 없음","간결하고 명확함|이해 가능|불명확"),
x:["기본 장비와 중복되는 아이템 제안"]},
{m:`저는 에너지 시스템 설계와 그리드 분야를 공부하고 싶습니다. 오늘 계획에서 에너지 소비와 생산을 맞추는 일이 생존과 직결된다고 느꼈습니다. KENTECH에서 차세대 그리드와 에너지 AI를 공부해 극한 환경에서도 안정적으로 운영되는 시스템을 만들고 싶습니다. 장기적으로는 우주 기지와 도서 지역에 적용할 수 있는 독립형 에너지 시스템을 연구하겠습니다.`,
r:R("오늘 문제의 경험과 연결|일부 연결|연결 없음","관심→문제→계획의 흐름|흐름 약함|논리 없음","구체적 연구 주제|일반적 포부|포부 없음","사회적 가치 인식|부분 인식|인식 없음","진정성 있고 간결함|보통|준비 부족"),
x:["일반적인 학교 칭찬에 그침"]}
]};

DETAIL[5]={ref:`<p><b>출제 의도:</b> 예산·기술·주민 의견을 종합해 우선순위를 정하고, 환경성·안정성·형평성이 부딪힐 때 조정하며 상황 변화에 계획을 수정하는 능력을 봅니다.</p>
<p><b>기준 계산(자료 기반)</b></p><ul><li>연 수요 42GWh → 평균 약 4.8MW. 여름 저녁 피크는 평시 대비 +35%로 약 6.5MW, 초과분 약 1.7MW. 4시간 지속 가정 시 약 6.7MWh를 저장·절감해야 함.</li><li>공공 태양광 10억당 1.2GWh, 주차장 태양광 20억당 2GWh(+충전 80면, 그늘), 배터리 10억당 4MWh, 효율 개선 10억당 대상 건물 소비 8%, 수요 반응 10억당 피크 3%, 풍력 15억에 1.1GWh(불확실).</li></ul>
<p><b>모범 계획 예시</b>(정답 아님, 100억 원): 공공 태양광 30억(연 3.6GWh) + 주차장 태양광 20억(연 2GWh) + 효율 개선 20억(취약 가구·노후 주택 우선) + 수요 반응 10억 + 배터리 20억(8MWh, 단계 도입) = 100억. 풍력은 풍황·소음 불확실로 제외. 생산 5.6GWh는 수요의 약 13%, 효율 개선(대상 건물이 전체의 절반이라 가정하면 약 16%)과 피크 3% 절감, 배터리 8MWh가 피크 대응을 맡음.</p>
<p><b>2년 차 변경 예시:</b> 예산 20% 감소(80억 기준), 배터리 6개월 지연 → 효율 개선·수요 반응 비중을 확대하고 배터리는 규모를 줄여 후순위 도입, 공공건물 냉방 시간 조정으로 피크 선대응, 계약 전 사업 재검토.</p>`,
q:[
{a:`<p>예산 100억 내 선택과 실행 순서를 설명하는 핵심 문항. 효과가 확실하고 빨리 시작할 수 있는 사업(공공 태양광, 효율 개선)을 먼저, 불확실하거나 갈등 가능성이 큰 사업(배터리, 풍력)을 나중에 배치하는지 봅니다.</p>`,p:["예산 합계가 100억 이내임을 계산했다","사업별 효과(GWh, %, MWh)를 자료로 제시했다","실행 순서와 이유(확실성·갈등·긴급성)를 말했다","피크 수요(여름 저녁 +35%)에 대한 대응이 있다"],f:["풍력을 제외한 이유는? 포함한다면 얼마나?","배터리 용량 8MWh는 피크 4시간 기준으로 충분한가요?"],
m:`저는 공공 태양광 30억 원, 주차장 태양광 20억 원, 건물 효율 개선 20억 원, 수요 반응 10억 원, 배터리 20억 원으로 100억 원을 배분하겠습니다. 공공 태양광은 연 3.6GWh, 주차장 태양광은 연 2GWh를 만들고 충전 시설과 그늘이라는 부가 가치가 있습니다. 효율 개선은 노후 주택과 취약 가구에 우선 적용해 비용 부담을 줄이고 피크도 낮춥니다. 연 수요 42GWh의 평균은 약 4.8MW이고 여름 저녁 피크는 약 6.5MW이므로 초과분 약 1.7MW를 4시간 감당하려면 약 6.7MWh가 필요합니다. 수요 반응 3%와 효율 개선이 일부를 줄이고 배터리 8MWh가 나머지를 맡습니다. 순서는 1년 차에 태양광과 효율 개선, 2년 차에 수요 반응, 안전 검토와 주민 협의를 마친 뒤 배터리를 설치하겠습니다. 풍력은 풍황이 불확실하고 소음 우려가 있어 이번 계획에서는 제외했습니다.`,
r:R("예산·효과·피크 계산이 정확|계산 일부 오류|수치 없음","선택→순서→이유가 일관됨|일부 누락|근거 없음","순서 전략과 단계 도입 설계|무난한 배분|설계 의도 없음","취약 가구·주민 안전을 고려|일부 고려|고려 없음","표를 읽듯 간결하게 설명|이해 가능|혼란"),x:["예산 100억 초과","피크 수요를 다루지 않음","사업 순서에 근거가 없음"]},
{a:`<p>성과 지표 설정과 측정 방법. 발전량만이 아니라 피크 감소와 형평성 지표를 포함하는지 확인합니다.</p>`,p:["지표가 3개이고 서로 다른 측면을 본다","사업 전 기준선과 비교 방법을 제시했다","취약 가구 등 형평성 지표를 포함했다"],f:["지표가 목표를 왜곡할 수 있다면?","측정 비용은 어떻게 줄이나요?"],
m:`첫째 연간 재생에너지 공급량과 여름 저녁 최대전력 감소율, 둘째 취약 가구의 에너지 비용 변화, 셋째 주민 수용성과 참여율을 지표로 삼겠습니다. 재생에너지 공급량은 계량기 자료로 매년 같은 기간을 비교하고, 피크 감소율은 사업 전 3년 평균 피크를 기준선으로 삼아 측정합니다. 취약 가구 지표는 가구 유형별로 나누어 평균만 보지 않고 하위 20%의 변화를 따로 공개합니다. 수용성은 정기 설문과 민원 건수를 함께 봅니다. 발전량만 보면 혜택이 일부 아파트에 쏠려도 알 수 없기 때문에 형평성 지표를 필수로 넣었습니다.`,
r:R("지표별 측정 방법·기준선을 구체화|일부만 구체화|측정 방법 없음","목표→지표→측정의 연결|연결 약함|나열","형평성 등 새로운 관점의 지표|일반적 지표|지표 부족","취약 가구 관점을 포함|부분 포함|포함 없음","쉽고 명확하게 설명|이해 가능|산만"),x:["발전량 한 가지로만 평가","측정 방법 없이 지표만 나열"]},
{a:`<p>이해관계 조정 문항. 반대 의견을 인정하고 설계·절차·보상으로 반영하는지, 필요시 계획을 수정할 의지가 있는지 봅니다.</p>`,p:["아파트 주민과 상인의 우려를 각각 구체적으로 짚었다","안전 검증·공사 시간·보상 등 구체적 조정안을 제시했다","합의가 안 되면 계획을 바꾸겠다는 대안이 있다"],f:["주민 투표에서 반대가 과반이면?","화재 사고가 난다면 누가 책임지나요?"],
m:`아파트 주민은 화재, 상인은 영업 피해를 걱정하므로 각각 다른 방법으로 대응하겠습니다. 배터리는 독립 안전 검토를 받고 소방 기준보다 높은 이격 거리와 화재 감지·차단 설비를 갖춘 뒤 검토 결과와 비상 대응 훈련을 공개하겠습니다. 주민 대표가 점검에 참여하게 하여 설치 위치도 함께 정하겠습니다. 시장 공사는 구간별로 나누어 비수기에 진행하고 임시 동선과 피해 지원 기준을 상인과 미리 협의하겠습니다. 우려가 해소되지 않으면 배터리 설치를 늦추고 효율 개선과 수요 반응을 먼저 확대하겠습니다.`,
r:R("우려를 자료(주민 의견)로 정확히 반영|일부 반영|반영 없음","우려→조정→대안의 흐름|일부 누락|논리 없음","공개 점검·구간 공사 등 구체적 장치|일반적 약속|장치 없음","안전과 생계를 모두 존중|한쪽만 존중|무시","경청하고 협의적인 어조|형식적|일방적"),x:["반대 의견을 설득 대상으로만 봄"]},
{a:`<p>조건 변화(예산 −20%, 배터리 6개월 지연)에서 계획을 유연하게 수정하는지 평가.</p>`,p:["축소된 예산(80억) 기준으로 재배분했다","피크 대응을 지연 기간에 어떻게 메우는지 구체적으로 말했다","계약 전 사업을 재검토하는 판단을 했다"],f:["이미 집행한 사업은 어떻게 하나요?","배터리가 끝내 오지 않으면?"],
m:`예산이 20% 줄어 80억 원이 되면 이미 계약한 공공 태양광과 효율 개선은 유지하고, 아직 계약하지 않은 사업을 재검토하겠습니다. 배터리는 규모를 줄이거나 납품 시기까지 후순위로 돌리고, 지연되는 6개월 동안 효율 개선과 수요 반응을 확대하겠습니다. 피크 시간대 공공건물의 냉방을 조정하고 참여 가구에 보상을 주어 피크를 낮추며, 필요하면 기존 전력망과 비상 운영계획을 병행합니다. 배터리는 안전·비용 검토를 마친 뒤 도입 시기를 다시 정하겠습니다.`,
r:R("변경된 수치로 재계산|일부 계산|계산 없음","변화→영향→수정의 흐름|일부 누락|논리 약함","수요 관리 등 비배터리 대안|단순 축소|대안 없음","취약 가구·안전 보호를 유지|일부 유지|무시","침착하게 우선순위 설명|이해 가능|혼란"),x:["조건이 바뀌었는데 원래 계획을 고수"]},
{a:`<p>형평성 문항. 혜택이 특정 집단에 쏠리지 않도록 설계·절차·모니터링을 제시하는지 봅니다.</p>`,p:["수혜 집단과 소외 집단을 구분했다","신청 절차 간소화·방문 신청 등 접근성 장치를 제시했다","모니터링과 시정 방법이 있다"],f:["공공 재원을 쓰는데 특정 아파트가 더 큰 혜택을 받으면?","에너지 빈곤층은 어떻게 찾나요?"],
m:`노후 주택과 에너지 비용 부담이 큰 가구를 우선 지원 대상으로 정하고, 방문 신청과 담당자 안내로 절차를 단순화하겠습니다. 주거 유형별로 비용 절감액과 참여율을 공개해 혜택이 특정 아파트에 쏠리는지 확인하고, 쏠림이 보이면 지원 기준을 조정합니다. 지원 기준은 주민 대표와 함께 정해 공정성을 확인하겠습니다. 설비 수익 일부는 취약 가구 지원 기금으로 돌리는 방안도 검토합니다.`,
r:R("자료(노후 주택 민원)를 인용해 대상 특정|일부 인용|근거 없음","문제→장치→모니터링의 흐름|일부 누락|논리 없음","접근성·기금 등 구체적 장치|일반적 선언|장치 없음","형평성과 효율의 균형을 인식|한쪽만 고려|무시","경청과 공감이 드러남|보통|일방적"),x:["‘모두에게 혜택’이라는 선언만 함"]},
{a:`<p>실증 결과 해석과 중단·수정 판단. 사전 기준(기준선, 최소 성과)을 두는지 평가.</p>`,p:["안전·비용·절감량·수용성 같은 사전 기준을 제시했다","기준 충족·부분 충족·미충족별 행동을 구분했다","매몰비용에 얽매이지 않고 판단했다"],f:["성과가 기준에 약간 못 미치면?","중단 시 이미 쓴 비용은?"],
m:`사업 전에 안전, 비용, 절감량, 주민 수용성의 최소 기준을 정하겠습니다. 모든 기준을 충족하면 확대하고, 일부만 부족하면 설계를 고쳐 한 번 더 실증하며, 안전 기준을 충족하지 못하거나 효과가 계속 낮으면 중단하고 예산을 검증된 효율 개선으로 옮기겠습니다. 이미 쓴 비용은 되돌릴 수 없으므로 앞으로 얻을 효과만 기준으로 판단합니다. 결과와 중단 사유는 주민에게 공개해 신뢰를 유지하겠습니다.`,
r:R("사전 기준을 수치로 제시|기준이 모호|기준 없음","기준→결과→행동의 연결|일부 연결|논리 없음","수정 후 재실증 등 단계적 판단|이분법 판단|판단 없음","안전·투명성을 고려|부분 고려|무시","결단력과 책임 의식|보통|회피"),x:["기준 없이 느낌으로 결정"]},
{a:`<p>성찰 문항. 자신이 세운 계획의 한계를 정직하게 인정하고 다음 단계 검증 계획을 말하는지 봅니다.</p>`,p:["가장 큰 불확실성을 구체적으로 지목했다","검증 방법(측정·실증)이 있다","한계를 인정하는 겸손한 태도가 있다"],f:["그 불확실성은 누가 줄일 수 있나요?"],
m:`가장 큰 불확실성은 수요 반응이 여름 저녁 피크를 얼마나 줄일지, 그리고 주민 참여가 지속될지입니다. 계획의 피크 대응이 이 두 가지에 크게 의존하기 때문입니다. 그래서 공공건물과 소규모 가구에서 먼저 실증해 시간대별 부하, 참여율, 민원을 측정하겠습니다. 결과를 공개한 뒤 사업 확대 여부와 배터리 규모를 정하겠습니다. 제 계획은 가정이 많으므로 데이터가 나오면 계획을 바꿀 수 있다고 생각합니다.`,
r:R("불확실성과 영향을 자료로 구체화|일반적 불확실성|언급 없음","불확실성→확인 방법→의사결정 연결|일부 연결|논리 약함","작은 실증 설계 등 창의적 검증|일반적 조사|검증 없음","한계 인정과 개선 의지|부분 인정|무시","솔직하고 차분함|보통|방어적"),x:["불확실성이 없다고 답함"]}
]};

function renderCheck(set){
 cur=set;

function modelGuide(set,i){
 const samples=[
 `저는 공공 태양광을 우선 실증하겠습니다. 외벽 발전 기술은 기존 건물에 적용할 수 있지만 풍속·소음·내구성과 폐기 문제를 더 확인해야 합니다. 다른 후보 기술도 설치비와 실제 생산량을 같은 기준으로 비교하고, 주민 의견을 수렴한 뒤 확대 여부를 결정하겠습니다.`,
 `남사면 태양광을 기본으로 하고 풍황이 좋은 곳의 풍력과 해협 조류 발전을 보완 전원으로 검토하겠습니다. 발전량이 계절과 날씨에 따라 달라지므로 저장장치와 수요 관리도 예산에 포함합니다. 갯벌과 방목지 영향을 피하고 주민과 위치를 협의하며, 실제 발전량을 확인해 단계적으로 설치하겠습니다.`,
 `먼저 세 나라의 지수에서 가장 뒤처진 항목을 확인하고, 단기 사업과 장기 사업을 나누겠습니다. 초기에 기반 시설과 교육을 보완하고 매 단계에서 과학·행복·환경 지수와 비용을 다시 측정해 다음 투자를 조정하겠습니다. 한 지수의 개선이 다른 지수의 악화로 이어지지 않는지 공개적으로 점검하겠습니다.`,
 `저는 샤클턴 능선 후보지를 추가 조사하겠습니다. 일조가 길고 인근에 얼음 자원이 있지만 착륙 지형과 극한 환경이 위험입니다. 태양광과 안정적인 보조 전원을 조합하고, 엔지니어·의료·심리 인력을 포함해 긴 밤과 장비 고장에 대비하겠습니다. 현장 탐사 결과가 위험 기준을 넘으면 용암 동굴 입구로 계획을 바꾸겠습니다.`
 ];
 if(set.id===5){const answers=[
 `공공 태양광과 건물 효율 개선을 우선하겠습니다. 두 사업은 공공 지붕과 기존 건물에서 시작할 수 있어 효과를 확인하기 쉽습니다. 취약 가구 지원과 수요 반응 실증에도 예산을 남기고, 배터리는 안전 검토와 주민 협의 뒤 단계적으로 설치하겠습니다.`,
 `지표는 연간 재생에너지 공급량, 여름 저녁 최대전력 감소율, 취약 가구 에너지 비용 변화입니다. 사업 전 기준선과 매년 같은 기간을 비교하고, 가구 유형별 결과와 참여율을 함께 공개하겠습니다. 발전량만으로는 혜택의 형평성을 알 수 없기 때문입니다.`,
 `배터리 안전을 독립 검토하고 비상 대응 훈련 결과를 공개하겠습니다. 주민 대표가 점검에 참여하게 하고, 시장 공사는 구간별·비수기에 진행하며 임시 동선과 피해 지원 기준을 상인과 협의하겠습니다. 우려가 해소되지 않으면 배터리를 늦추고 효율 개선부터 하겠습니다.`,
 `예산이 줄고 납품이 늦으면 효율 개선과 수요 반응을 우선하고 아직 계약하지 않은 사업을 재검토하겠습니다. 피크 시간 공공건물 부하를 낮추고 참여 가구에 보상하겠습니다. 배터리는 안전·비용 검토를 마친 뒤 도입하고, 기존 전력망과 비상 운영계획을 마련하겠습니다.`,
 `노후 주택과 에너지 비용 부담이 큰 가구에 지원을 먼저 안내하고, 방문 신청을 포함해 절차를 단순화하겠습니다. 주거 유형별 비용 절감과 참여율을 공개해 혜택이 특정 아파트에 쏠리지 않는지 확인하고 주민과 지원 기준을 정하겠습니다.`,
 `안전, 비용, 절감량, 주민 수용성의 최소 기준을 사업 전에 정하겠습니다. 기준을 충족하면 확대하고, 일부 부족하면 설계를 고쳐 한 번 더 실증하겠습니다. 안전 기준을 충족하지 못하거나 효과가 계속 낮으면 중단하고 검증된 효율 개선에 예산을 옮기겠습니다.`,
 `가장 큰 불확실성은 수요 반응이 여름 저녁 피크를 얼마나 줄이고 주민 참여가 지속될지입니다. 공공건물과 소규모 가구에서 먼저 실증해 시간대별 부하, 참여율, 불편 민원을 측정하겠습니다. 결과를 공개한 뒤 사업 확대와 저장장치 규모를 정하겠습니다.`
 ];return `<b>모범 답변 예시</b><br>${answers[i]}`}
 let lens='이 선택은 자료의 수치와 조건을 근거로 설명하고, 한계와 대응책까지 연결합니다.';if(/KENTECH|공부하고/.test(set.questions[i].q))lens='관심 분야를 오늘 문제에서 생긴 구체적 질문과 연결하고 대학에서 해보고 싶은 탐구를 덧붙입니다.';else if(/어려웠|고민/.test(set.questions[i].q))lens='어려웠던 선택, 비교 기준, 포기한 대안, 판단을 바꿀 새 정보 순서로 답합니다.';else if(/설득|주민|반대|갈등/.test(set.questions[i].q))lens='상대의 우려를 듣고 근거와 불확실성을 공개한 뒤 실증·협의·수정 절차를 제시합니다.';return `<b>모범 답변 예시</b><br>${samples[set.id-1]}<br><span class="small">질문에 따라 강조점: ${escapeHtml(lens)}</span>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function modelGuide(set,i){const q=set.questions[i].q;const base={1:'주장을 먼저 밝히고, 자료의 수치나 사례를 근거로 연결합니다. 장점과 한계를 함께 검토한 뒤 실행 조건이나 보완책을 제안합니다.',2:'수요와 지역 조건을 근거로 선택을 설명합니다. 계절·고장·주민 수용성을 함께 고려하고, 저장·분산·단계적 실행 등 대안을 제시합니다.',3:'그래프의 구체적 변화와 시점을 인용해 비교합니다. 목표와 우선순위를 밝히고, 실행 순서·예상 효과·부작용을 점검합니다.',4:'기지 위치·에너지·인력 선택을 수치와 조건으로 설명합니다. 위험과 예비 계획을 포함하고, 새 조건이 생기면 무엇을 바꾸는지 우선순위로 답합니다.'};
let lens='핵심 주장 → 자료 근거 2개 → 선택의 이유 → 한계/반론 → 실행 가능한 보완책';if(/KENTECH|공부하고/.test(q))lens='관심 분야와 문제에서 발견한 질문을 연결하고, KENTECH에서 해보고 싶은 학습·탐구를 구체적으로 말합니다.';else if(/어려웠|고민/.test(q))lens='어려운 선택 → 비교한 기준 → 포기한 대안과 이유 → 새로 알게 된 점 순으로 설명합니다.';else if(/설득|주민|반대|갈등/.test(q))lens='상대 우려를 먼저 확인 → 근거와 불확실성 공개 → 작은 실증/협의 → 결과에 따른 조정 방안을 제시합니다.';return `${base[set.id]}<br><b>답변 구성 예시:</b> ${lens}. 특정 선택만 정답은 아니며 자료 근거와 일관성이 중요합니다.`}
function candidateLabel(value){const p=String(value||"").indexOf("_");return p>0?String(value).slice(0,p)+" · "+String(value).slice(p+1):String(value||"")}
function collectTeacherData(){const rows=[],answers=[];for(let n=0;n<localStorage.length;n++){const key=localStorage.key(n);if(!key)continue;let m=key.match(/^kentech27:judge:([^:]+):(\d+):(\d+):([AB])$/);if(m)try{rows.push({key,candidate:decodeURIComponent(m[1]),sid:+m[2],qi:+m[3],reviewer:m[4],data:JSON.parse(localStorage.getItem(key))})}catch{};m=key.match(/^kentech27:answer:([^:]+):(\d+):(\d+)$/);if(m)try{answers.push({key,candidate:decodeURIComponent(m[1]),sid:+m[2],qi:+m[3],data:JSON.parse(localStorage.getItem(key))})}catch{}}return{rows,answers}}
function renderGradingSheet(candidate='',sid=0,reviewer='A',teacher=''){const h=$("home"),d=collectTeacherData(),names=[...new Set(d.answers.map(x=>x.candidate))].sort();if(!candidate)candidate=names[0]||'';if(!sid&&candidate)sid=d.answers.find(x=>x.candidate===candidate)?.sid||0;$("done").hidden=true;$("home").hidden=false;h.innerHTML=`<button class="btn ghost small no-print" id="gradeBack">← 처음 화면으로</button><div class="eyebrow" style="margin-top:12px">교사용 · 개별 채점</div><h1>채점 시트</h1><p class="mute">먼저 <b>학생 답변 불러오기</b>로 학생이 저장한 JSON 파일을 불러온 뒤 학생의 준비 답변과 모범답안을 보며 면접 답변을 기록하고 채점하세요. 채점 결과는 이 기기에 자동 저장되며, 완료 후 교사별 JSON 파일로 저장합니다.</p><div class="toolbar no-print"><select id="gCandidate"><option value="">학생 선택</option>${names.map(n=>`<option value="${escapeHtml(n)}" ${n===candidate?'selected':''}>${escapeHtml(candidateLabel(n))}</option>`).join('')}</select><select id="gSet"><option value="0">세트 선택</option>${SETS.map(x=>`<option value="${x.id}" ${x.id===Number(sid)?'selected':''}>${escapeHtml(x.title)}</option>`).join('')}</select><select id="gReviewer"><option value="A" ${reviewer==='A'?'selected':''}>면접관 A</option><option value="B" ${reviewer==='B'?'selected':''}>면접관 B</option></select><label>교사 이름 <input id="gTeacher" value="${escapeHtml(teacher)}" placeholder="이름 입력"></label><label class="btn">학생 답변 불러오기<input id="gImport" type="file" accept="application/json,.json" multiple hidden></label><button class="btn" id="gSave">채점 자료 저장</button></div><div id="gContent"></div>`;$("gradeBack").onclick=()=>{renderHome();window.scrollTo(0,0)};const redraw=()=>renderGradingSheet($("gCandidate").value,Number($("gSet").value),$("gReviewer").value,$("gTeacher").value);$("gCandidate").onchange=redraw;$("gSet").onchange=redraw;$("gReviewer").onchange=redraw;$("gImport").onchange=async e=>{let first=null,ok=0;for(const f of e.target.files){try{const pack=JSON.parse(await f.text());if(!Array.isArray(pack))throw 0;let n=0;for(const x of pack){const m=x.key&&x.key.match(/^kentech27:answer:([^:]+):(\d+):(\d+)$/);if(m&&typeof x.value==='string'){localStorage.setItem(x.key,x.value);n++;if(!first)first={candidate:decodeURIComponent(m[1]),sid:+m[2]}}}if(!n)throw 0;ok++}catch{alert('학생 답변 파일을 읽을 수 없습니다: '+f.name)}}renderGradingSheet(first?first.candidate:'',first?first.sid:0,reviewer,teacher)};
 const set=SETS.find(x=>x.id===Number(sid));const qAnswers=d.answers.filter(x=>x.candidate===candidate&&x.sid===Number(sid));if(!candidate||!set||!qAnswers.length){$("gContent").innerHTML=`<div class="notice warn">학생 답변을 아직 불러오지 않았거나 학생·세트를 선택하지 않았습니다. 위의 <b>학생 답변 불러오기</b> 버튼으로 학생이 답변저장하기로 받은 JSON 파일을 불러오세요.</div>`}
 else{$("gContent").innerHTML=`<section class="card"><h2>${escapeHtml(candidateLabel(candidate))} · ${escapeHtml(set.title)}</h2>${(DETAIL[set.id]||{}).ref?`<details class="card gref" open><summary><b>세트 해설 · 기준 풀이</b> (채점 전 먼저 읽어 주세요)</summary><div class="jref">${DETAIL[set.id].ref}</div></details>`:''}<p class="small mute">채점 항목 순서: 1 자료·근거 활용 · 2 논리·구조 · 3 창의·실현 가능성 · 4 관점·윤리 고려 · 5 소통·성찰. 각 1–5점.</p><div class="scroll"><table><tr><th>면접 질문</th><th>학생 준비 답변</th><th>학생 구술 답변 기록</th><th>5개 기준 점수·합계</th><th>관찰 메모</th></tr>${set.questions.map((q,i)=>{const w=qAnswers.find(x=>x.qi===i)?.data||{},old=d.rows.find(x=>x.candidate===candidate&&x.sid===Number(sid)&&x.qi===i&&x.reviewer===reviewer)?.data||{},ink=w.ink?`<br><img src="${w.ink}" alt="학생 필기" style="max-width:240px;max-height:130px">`:'';return `<tr><td>${i+1}. ${escapeHtml(q.q)}</td><td>${escapeHtml(w.text||(w.ink?'손글씨 답변':'기록 없음'))}${ink}${w.spoken?`<div class="spk"><b>면접 구술 (음성 받아쓰기)</b><br>${escapeHtml(w.spoken)}</div>`:''}</td><td><textarea class="grade-field" data-q="${i}" data-kind="spoken" rows="5" placeholder="학생이 면접에서 말한 답을 받아쓰기 또는 요약">${escapeHtml(old.spoken?old.spoken:(w.spoken||''))}</textarea></td><td><div class="teacher-rubric">${rubric.map((label,k)=>`<label title="${label}">${k+1}<input class="grade-field" data-q="${i}" data-kind="score" data-k="${k}" type="number" min="1" max="5" value="${old.scores?.[k]??''}"></label>`).join('')}</div><b id="gs${i}">${((old.scores||[]).map(Number).filter(v=>v>=1&&v<=5).reduce((a,b)=>a+b,0))||'—'} / 25</b></td><td><textarea class="grade-field" data-q="${i}" data-kind="note" rows="4" placeholder="관찰 메모">${escapeHtml(old.note||'')}</textarea></td></tr><tr class="gdet"><td colspan="5"><details><summary><b>질문 ${i+1} 모범답안·채점 기준 보기</b></summary>${modelGuide(set,i)}</details></td></tr>`}).join('')}</table></div></section>`;$("gContent").oninput=e=>{const t=e.target;if(!t.classList.contains('grade-field'))return;const q=Number(t.dataset.q),key=judgeKey(candidate,Number(sid),q,reviewer);let v={scores:[],spoken:'',note:'',teacher:$('gTeacher').value};try{v=JSON.parse(localStorage.getItem(key)||'{}')}catch{};if(t.dataset.kind==='spoken')v.spoken=t.value;else if(t.dataset.kind==='score'){v.scores=v.scores||[];v.scores[Number(t.dataset.k)]=t.value}else v.note=t.value;v.teacher=$('gTeacher').value;if(!v.spoken&&t.dataset.kind!=='spoken'){const sw=qAnswers.find(x=>x.qi===q);if(sw&&sw.data&&sw.data.spoken)v.spoken=sw.data.spoken}localStorage.setItem(key,JSON.stringify(v));if(t.dataset.kind==='score'){const s=(v.scores||[]).map(Number).filter(n=>n>=1&&n<=5).reduce((a,b)=>a+b,0),el=$('gs'+q);if(el)el.textContent=(s||'—')+' / 25'}}}
 $("gSave").onclick=()=>{const who=$("gCandidate").value,which=Number($("gSet").value),rev=$("gReviewer").value,tname=$("gTeacher").value.trim(),dataset=collectTeacherData(),items=dataset.rows.filter(r=>r.candidate===who&&r.sid===which&&r.reviewer===rev).map(r=>({qi:r.qi,...r.data,teacher:tname})),studentAnswers=dataset.answers.filter(a=>a.candidate===who&&a.sid===which).map(a=>({qi:a.qi,...a.data}));if(!who||!which||!studentAnswers.length){alert('학생과 세트를 선택하고 학생 면접자료를 먼저 가져오세요.');return}if(!tname){alert('교사 이름을 입력한 뒤 채점 자료를 저장해 주세요.');return}if(!items.some(x=>(x.scores||[]).some(v=>Number(v)>=1&&Number(v)<=5))){alert('점수를 하나 이상 입력한 뒤 채점 자료를 저장해 주세요.');return}items.forEach(it=>{if(!it.spoken){const a=studentAnswers.find(x=>x.qi===it.qi);if(a&&a.spoken)it.spoken=a.spoken}});const pack={format:'KENTECH-teacher-grade-v1',candidate:who,studentId:who.split('_')[0],studentName:who.split('_').slice(1).join('_'),sid:which,setTitle:SETS.find(x=>x.id===which)?.title,reviewer:rev,teacher:tname,savedAt:new Date().toISOString(),studentAnswers,items};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}));const studentFileName=(who.split('_').slice(1).join('_')||who).replace(/[\\/:*?"<>|]/g,'_'),teacherFileName=(tname||rev).replace(/[\\/:*?"<>|]/g,'_');a.download=`KENTECH_채점_${studentFileName}_${teacherFileName}_세트${which}.json`;a.click()}}
